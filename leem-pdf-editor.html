<!DOCTYPE html>
<html lang="en">
<head>
<script src="/icons.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDF Annotator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#111118;
  --panel:#1a1a24;
  --card:#22222e;
  --border:#2e2e40;
  --accent:#f5a623;
  --accent2:#e05a5a;
  --green:#3ecf8e;
  --text:#e8e8f2;
  --muted:#6e6e8a;
  --r:8px;
}

body{
  font-family:'Courier New',Courier,monospace;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── HEADER ── */
header{
  height:50px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  flex-shrink:0;
  z-index:100;
}
.logo{
  font-size:.95rem;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--accent);
  margin-right:8px;
}
.hbtn{
  padding:5px 12px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:.72rem;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  white-space:nowrap;
}
.hbtn:hover{border-color:var(--accent);background:#2a2518}
.hbtn.green{background:var(--green);color:#0a1a10;border-color:var(--green);font-weight:700}
.hbtn.green:hover{opacity:.85}
.hbtn:disabled{opacity:.35;cursor:not-allowed}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.page-info{font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ── BODY ── */
.body{
  display:flex;
  flex:1;
  overflow:hidden;
}

/* ── SIDEBAR ── */
.sidebar{
  width:240px;
  min-width:220px;
  background:var(--panel);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  flex-shrink:0;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:12px;
}
.section h4{
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:10px;
}
.field{
  font-size:.65rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  margin:8px 0 3px;
}
.field:first-of-type{margin-top:0}

input[type=text],input[type=number],select,textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:5px;
  color:var(--text);
  font-family:inherit;
  font-size:.73rem;
  padding:5px 8px;
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:52px}
select option{background:var(--card)}

input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;margin-top:2px}
input[type=color]{width:28px;height:22px;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer;padding:1px;flex-shrink:0}

.row{display:flex;align-items:center;gap:6px}
.val{font-size:.68rem;color:var(--accent);min-width:32px;text-align:right}

.abtn{
  width:100%;
  padding:7px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-size:.72rem;
  font-weight:600;
  margin-top:8px;
  transition:opacity .15s;
}
.abtn:hover{opacity:.82}
.abtn.primary{background:var(--accent);color:#1a1000}
.abtn.danger{background:var(--accent2);color:#fff}
.abtn.subtle{background:var(--border);color:var(--text)}

/* ── MAIN CANVAS AREA ── */
.main{
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:var(--bg);
  background-image:radial-gradient(circle,#1e1e2a 1px,transparent 0);
  background-size:22px 22px;
  padding:24px;
  gap:0;
  position:relative;
}

/* ── UPLOAD SCREEN ── */
#dropzone{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:var(--bg);
  background-image:radial-gradient(circle,#1e1e2a 1px,transparent 0);
  background-size:22px 22px;
  z-index:10;
}
#dropzone h2{
  font-size:1.8rem;
  font-weight:700;
  letter-spacing:3px;
  color:var(--text);
}
#dropzone h2 span{color:var(--accent)}
#dropzone p{font-size:.78rem;color:var(--muted)}
.drop-box{
  border:2px dashed var(--border);
  border-radius:14px;
  padding:40px 64px;
  text-align:center;
  cursor:pointer;
  transition:border-color .2s,background .2s;
  background:var(--panel);
}
.drop-box:hover,.drop-box.over{border-color:var(--accent);background:#1e180a}
.drop-box .icon{font-size:2.5rem;display:block;margin-bottom:8px}
.drop-box strong{font-size:.9rem;color:var(--text)}
.drop-box small{font-size:.7rem;color:var(--muted);display:block;margin-top:4px}

/* ── PDF VIEWER ── */
#viewer-wrap{
  position:relative;
  display:none;   /* shown after PDF loaded */
  flex-direction:column;
  align-items:center;
  gap:0;
}

/* each page: iframe + overlay stacked */
.page-stack{
  position:relative;
  margin-bottom:20px;
  box-shadow:0 6px 40px rgba(0,0,0,.7);
  border-radius:2px;
  overflow:visible;
  flex-shrink:0;
}
.page-frame{
  display:block;
  border:none;
  background:#fff;
}
.overlay{
  position:absolute;
  inset:0;
  pointer-events:none; /* children handle their own events */
  z-index:5;
  overflow:hidden;
}

/* annotation elements */
.ann{
  position:absolute;
  cursor:move;
  user-select:none;
  touch-action:none;
}
.ann.sel{outline:2px dashed var(--accent);outline-offset:2px}
.ann .delbtn{
  position:absolute;
  top:-9px;right:-9px;
  width:18px;height:18px;
  background:var(--accent2);
  color:#fff;border:none;border-radius:50%;
  font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  transition:transform .1s;
}
.ann .delbtn:hover{transform:scale(1.2)}

.text-ann{
  padding:2px 4px;
  background:transparent;
  white-space:pre-wrap;
  word-break:break-word;
  min-width:40px;
  min-height:20px;
  line-height:1.3;
}
.img-ann img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  pointer-events:none;
}
.wm-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
}
.wm-text{
  font-weight:900;
  transform-origin:center;
  white-space:nowrap;
  pointer-events:none;
}

/* nav bar */
#nav{
  display:none;
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:30px;
  padding:6px 14px;
  gap:10px;
  align-items:center;
  z-index:50;
  box-shadow:var(--shadow,0 4px 24px rgba(0,0,0,.5));
}
#nav.show{display:flex}
#nav span{font-size:.75rem;color:var(--muted)}

/* toast */
#toast{
  position:fixed;
  bottom:64px;
  left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:6px;
  padding:7px 16px;
  font-size:.73rem;
  color:var(--text);
  opacity:0;
  transition:opacity .2s,transform .2s;
  pointer-events:none;
  z-index:999;
  white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* resize handle */
.rhandle{
  position:absolute;
  bottom:-5px;right:-5px;
  width:12px;height:12px;
  background:var(--accent);
  border-radius:2px;
  cursor:se-resize;
  z-index:15;
}
</style>
</head>
<body>

<header>
  <div class="logo">PDF<span style="color:var(--text)">note</span></div>
  <div class="sep"></div>
  <button class="hbtn" id="btnOpen"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#folder"/></svg> Open PDF</button>
  <button class="hbtn" id="btnNew"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#file"/></svg> Blank</button>
  <div class="sep"></div>
  <button class="hbtn" id="btnAddText" disabled>＋ Text</button>
  <button class="hbtn" id="btnAddImg"  disabled>＋ Image</button>
  <div class="sep"></div>
  <button class="hbtn green" id="btnSave" disabled><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#save"/></svg> Export PDF</button>
  <span class="page-info" id="pageInfo"></span>
</header>

<div class="body">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- TEXT STYLE -->
    <div class="section" id="textSection">
      <h4>Text Style</h4>
      <div class="field">Font</div>
      <select id="fontFamily">
        <option value="Georgia,serif">Georgia</option>
        <option value="'Times New Roman',serif">Times New Roman</option>
        <option value="'Courier New',monospace">Courier New</option>
        <option value="Verdana,sans-serif">Verdana</option>
        <option value="Impact,sans-serif">Impact</option>
        <option value="'Trebuchet MS',sans-serif">Trebuchet MS</option>
        <option value="Palatino,serif">Palatino</option>
        <option value="'Comic Sans MS',cursive">Comic Sans</option>
      </select>
      <div class="field">Size</div>
      <input type="number" id="fontSize" value="20" min="6" max="200"/>
      <div class="field">Color</div>
      <div class="row">
        <input type="color" id="fontColor" value="#000000"/>
        <input type="range" id="fontOpacity" min="0" max="1" step="0.05" value="1"/>
        <span class="val" id="fontOpacityVal">100%</span>
      </div>
      <div class="field">Style</div>
      <div class="row" style="gap:4px">
        <button class="abtn subtle" id="btnBold"  style="margin-top:0;font-weight:700">B</button>
        <button class="abtn subtle" id="btnItalic" style="margin-top:0;font-style:italic">I</button>
        <button class="abtn subtle" id="btnUnder"  style="margin-top:0;text-decoration:underline">U</button>
      </div>
    </div>

    <!-- IMAGE -->
    <div class="section" id="imgSection" style="display:none">
      <h4>Image</h4>
      <div class="field">Opacity</div>
      <div class="row">
        <input type="range" id="imgOpacity" min="0.05" max="1" step="0.05" value="1" oninput="updateSelImg()"/>
        <span class="val" id="imgOpacityVal">100%</span>
      </div>
      <div class="field">Width (px)</div>
      <input type="number" id="imgW" min="10" oninput="updateSelImgSize()"/>
      <div class="field">Height (px)</div>
      <input type="number" id="imgH" min="10" oninput="updateSelImgSize()"/>
    </div>

    <!-- WATERMARK -->
    <div class="section">
      <h4>Watermark</h4>
      <div class="field">Text</div>
      <input type="text" id="wmText" value="DRAFT"/>
      <div class="field">Font</div>
      <select id="wmFont">
        <option value="Impact,sans-serif">Impact</option>
        <option value="Georgia,serif">Georgia</option>
        <option value="'Times New Roman',serif">Times New Roman</option>
        <option value="Verdana,sans-serif">Verdana</option>
        <option value="'Courier New',monospace">Courier New</option>
      </select>
      <div class="field">Color</div>
      <input type="color" id="wmColor" value="#888888"/>
      <div class="field">Size</div>
      <input type="number" id="wmSize" value="72" min="10" max="300"/>
      <div class="field">Opacity</div>
      <div class="row">
        <input type="range" id="wmOpacity" min="0.03" max="1" step="0.03" value="0.2" oninput="wmSlider()"/>
        <span class="val" id="wmOpacityVal">20%</span>
      </div>
      <div class="field">Rotation °</div>
      <div class="row">
        <input type="range" id="wmRotate" min="-90" max="90" value="-35" oninput="wmSlider()"/>
        <span class="val" id="wmRotateVal">-35°</span>
      </div>
      <div class="field">Apply to</div>
      <select id="wmTarget">
        <option value="current">Current page</option>
        <option value="all">All pages</option>
      </select>
      <button class="abtn primary" onclick="applyWatermark()">Apply Watermark</button>
      <button class="abtn danger"  onclick="removeWatermark()">Remove Watermark</button>
    </div>

    <!-- SELECTED ELEMENT -->
    <div class="section" id="selSection" style="display:none">
      <h4>Selected</h4>
      <button class="abtn danger" onclick="deleteSelected()"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#trash"/></svg> Delete</button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main" id="main">

    <div id="dropzone">
      <h2>PDF<span>note</span></h2>
      <p>Open a PDF to start annotating</p>
      <div class="drop-box" id="dropBox">
        <span class="icon"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#file"/></svg></span>
        <strong>Click or drag a PDF here</strong>
        <small>Your file never leaves your device</small>
      </div>
      <p style="font-size:.72rem;color:var(--muted)">— or —</p>
      <button class="hbtn" onclick="createBlank()" style="padding:8px 20px"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#sparkles"/></svg> Create Blank Page</button>
    </div>

    <div id="viewerWrap" style="display:none;flex-direction:column;align-items:center"></div>

  </main>
</div>

<!-- Nav -->
<div id="nav">
  <button class="hbtn" id="btnPrev"><svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#arrow-left"/></svg> Prev</button>
  <span id="navInfo">1 / 1</span>
  <button class="hbtn" id="btnNext">Next <svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#arrow-right"/></svg></button>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="pdfInput"  accept=".pdf"   style="display:none" onchange="onPdfChosen(event)"/>
<input type="file" id="imgInput"  accept="image/*" style="display:none" onchange="onImgChosen(event)"/>

<!-- pdf-lib loaded on demand from CDN (cached in localStorage for offline) -->
<script>
'use strict';

// ─── STATE ───────────────────────────────────────────────────────────────────
let pdfBytes    = null;   // raw Uint8Array of original PDF
let totalPages  = 0;
let curPage     = 1;
let selEl       = null;
let isBold=false, isItalic=false, isUnder=false;

// annotations: { pageNum: [{type, el, data}] }
const anns = {};
// watermarks per page: { pageNum: el }
const wms  = {};

// ─── PDF-LIB LOADER (offline-safe) ───────────────────────────────────────────
// Strategy: try localStorage cache first, then CDN, save to cache.
const PDFLIB_URL = 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js';
const PDFLIB_KEY = 'pdflib_1_17_1';

let PDFLib = null;

async function loadPDFLib() {
  if (PDFLib) return PDFLib;

  // Try cache
  let src = null;
  try { src = localStorage.getItem(PDFLIB_KEY); } catch(e) {}

  if (!src) {
    // Fetch from CDN
    try {
      const res = await fetch(PDFLIB_URL);
      if (!res.ok) throw new Error('fetch failed');
      src = await res.text();
      try { localStorage.setItem(PDFLIB_KEY, src); } catch(e) { /* storage full */ }
    } catch(e) {
      throw new Error('pdf-lib not available offline yet. Please open this file once with internet access — it will be cached for all future offline use.');
    }
  }

  // Inject as blob
  await new Promise((res, rej) => {
    const blob = new Blob([src], {type:'application/javascript'});
    const url  = URL.createObjectURL(blob);
    const s    = document.createElement('script');
    s.src = url;
    s.onload  = () => { URL.revokeObjectURL(url); res(); };
    s.onerror = () => rej(new Error('Script injection failed'));
    document.head.appendChild(s);
  });

  PDFLib = window.PDFLib;
  return PDFLib;
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, dur=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), dur);
}

// ─── OPEN / LOAD ─────────────────────────────────────────────────────────────
document.getElementById('btnOpen').onclick = () => document.getElementById('pdfInput').click();
document.getElementById('btnNew').onclick  = createBlank;
document.getElementById('dropBox').onclick = () => document.getElementById('pdfInput').click();

// Drag-drop on the drop box
const dropBox = document.getElementById('dropBox');
dropBox.addEventListener('dragover',  e => { e.preventDefault(); dropBox.classList.add('over'); });
dropBox.addEventListener('dragleave', ()=> dropBox.classList.remove('over'));
dropBox.addEventListener('drop', e => {
  e.preventDefault(); dropBox.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type==='application/pdf') loadPDF(f);
  else toast('Please drop a PDF file');
});

// Also support drag-drop anywhere on main
const main = document.getElementById('main');
main.addEventListener('dragover',  e => e.preventDefault());
main.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type==='application/pdf') loadPDF(f);
});

function onPdfChosen(e) {
  const f = e.target.files[0];
  if (f) loadPDF(f);
  e.target.value='';
}

async function loadPDF(file) {
  toast('Opening PDF...');
  const ab = await file.arrayBuffer();
  pdfBytes = new Uint8Array(ab);

  // Count pages by parsing the PDF xref naively
  // We use a simple text scan — no library needed just for counting
  totalPages = countPDFPages(ab);
  if (!totalPages || totalPages < 1) totalPages = 1;

  clearAll();
  document.getElementById('dropzone').style.display = 'none';
  buildViewer();
  enableUI();
  toast(`Loaded ${totalPages} page${totalPages>1?'s':''}`);
}

// Count pages without any library — scan PDF bytes for /Type /Page entries
function countPDFPages(ab) {
  try {
    const text = new TextDecoder('latin1').decode(ab);
    // Look for /Count N in a Pages dictionary
    const m = text.match(/\/Count\s+(\d+)/);
    if (m) return parseInt(m[1]);
    // Fallback: count /Type /Page occurrences (individual pages)
    const matches = text.match(/\/Type\s*\/Page[^s]/g);
    if (matches) return matches.length;
  } catch(e) {}
  return 1;
}

async function createBlank() {
  // Create a minimal blank PDF in memory (no library — raw PDF syntax)
  // A valid one-page PDF that browsers can render:
  const blankPDF = `%PDF-1.4
1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj
2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj
3 0 obj<</Type/Page/MediaBox[0 0 595 842]/Parent 2 0 R/Resources<<>>>>endobj
xref
0 4
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
trailer<</Size 4/Root 1 0 R>>
startxref
217
%%EOF`;
  const enc  = new TextEncoder();
  pdfBytes   = enc.encode(blankPDF);
  totalPages = 1;
  clearAll();
  document.getElementById('dropzone').style.display = 'none';
  buildViewer();
  enableUI();
  toast('Blank page created');
}

// ─── VIEWER ──────────────────────────────────────────────────────────────────
function clearAll() {
  const wrap = document.getElementById('viewerWrap');
  wrap.innerHTML = '';
  Object.keys(anns).forEach(k => delete anns[k]);
  Object.keys(wms).forEach(k  => delete wms[k]);
  selEl = null;
  curPage = 1;
}

function buildViewer() {
  const wrap = document.getElementById('viewerWrap');
  wrap.innerHTML = '';
  wrap.style.display = 'flex';

  // We render ALL pages as iframes side-by-side vertically
  // Each page = object element showing PDF with page hash
  const blob = new Blob([pdfBytes], {type:'application/pdf'});
  const blobUrl = URL.createObjectURL(blob);

  for (let p = 1; p <= totalPages; p++) {
    const stack = document.createElement('div');
    stack.className = 'page-stack';
    stack.id = 'stack-' + p;
    stack.dataset.page = p;

    // Use <object> for PDF display — works offline, no JS library needed
    // We use a fixed A4-ish size; iframe/object renders the actual PDF
    const obj = document.createElement('object');
    obj.data   = blobUrl + '#page=' + p + '&toolbar=0&navpanes=0&scrollbar=0&view=FitH';
    obj.type   = 'application/pdf';
    obj.className = 'page-frame';
    // A4 proportions at 96dpi scale ~ 794×1123
    obj.style.width  = '794px';
    obj.style.height = '1123px';
    obj.innerHTML = `<div style="padding:40px;text-align:center;color:#999;font-size:.8rem">
      PDF preview not supported in this browser.<br>
      Annotations still work — export to see final PDF.
    </div>`;

    // Overlay div (pointer-events: none — children use auto)
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.id = 'ov-' + p;
    ov.style.width  = '794px';
    ov.style.height = '1123px';
    // Allow clicks on overlay itself for deselect
    ov.style.pointerEvents = 'auto';
    ov.addEventListener('click', e => {
      if (e.target === ov) deselect();
    });

    stack.appendChild(obj);
    stack.appendChild(ov);
    wrap.appendChild(stack);
  }

  updateNav();
  document.getElementById('nav').className = totalPages > 1 ? 'show' : '';
  document.getElementById('pageInfo').textContent = `${totalPages} page${totalPages>1?'s':''}`;
}

function enableUI() {
  ['btnAddText','btnAddImg','btnSave'].forEach(id =>
    document.getElementById(id).disabled = false);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function updateNav() {
  document.getElementById('navInfo').textContent = `${curPage} / ${totalPages}`;
  document.getElementById('btnPrev').disabled = curPage <= 1;
  document.getElementById('btnNext').disabled = curPage >= totalPages;
}

document.getElementById('btnPrev').onclick = () => { if (curPage>1) { curPage--; scrollToPage(curPage); updateNav(); }};
document.getElementById('btnNext').onclick = () => { if (curPage<totalPages) { curPage++; scrollToPage(curPage); updateNav(); }};

function scrollToPage(p) {
  const el = document.getElementById('stack-' + p);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// Intersection observer to track current page
const io = new IntersectionObserver(entries => {
  let best = null, bestR = 0;
  entries.forEach(e => { if (e.intersectionRatio > bestR) { bestR=e.intersectionRatio; best=e.target; } });
  // We watch all stacks
}, {threshold:[0,0.25,0.5,0.75,1]});

// ─── ADD TEXT ────────────────────────────────────────────────────────────────
document.getElementById('btnAddText').onclick = () => {
  if (!pdfBytes && totalPages===0) return;
  // Add to current visible page (or page 1)
  const p = getVisiblePage();
  addTextAnn(p, 80, 80);
};

function addTextAnn(pageNum, x, y) {
  const ov = document.getElementById('ov-' + pageNum);
  if (!ov) return;

  const el = document.createElement('div');
  el.className = 'ann text-ann';
  el.contentEditable = 'true';
  el.style.left     = x + 'px';
  el.style.top      = y + 'px';
  el.style.position = 'absolute';
  el.style.fontFamily = document.getElementById('fontFamily').value;
  el.style.fontSize   = document.getElementById('fontSize').value + 'px';
  el.style.color      = document.getElementById('fontColor').value;
  el.style.opacity    = document.getElementById('fontOpacity').value;
  el.style.fontWeight = isBold   ? 'bold'      : 'normal';
  el.style.fontStyle  = isItalic ? 'italic'     : 'normal';
  el.style.textDecoration = isUnder ? 'underline' : 'none';
  el.style.pointerEvents = 'auto';
  el.textContent = 'Double-click to edit';

  addDelBtn(el, pageNum);
  makeDraggable(el, ov);
  ov.appendChild(el);
  saveAnn(pageNum, el, 'text');
  selectEl(el);
  el.focus();
  document.execCommand('selectAll');
  toast('Text added — click to edit');
}

// sync selected text element to sidebar controls
function syncTextStyle() {
  if (!selEl || !selEl.classList.contains('text-ann')) return;
  selEl.style.fontFamily     = document.getElementById('fontFamily').value;
  selEl.style.fontSize       = document.getElementById('fontSize').value + 'px';
  selEl.style.color          = document.getElementById('fontColor').value;
  selEl.style.opacity        = document.getElementById('fontOpacity').value;
  selEl.style.fontWeight     = isBold   ? 'bold'      : 'normal';
  selEl.style.fontStyle      = isItalic ? 'italic'    : 'normal';
  selEl.style.textDecoration = isUnder  ? 'underline' : 'none';
}

['fontFamily','fontSize','fontColor','fontOpacity'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('fontOpacityVal').textContent =
      Math.round(parseFloat(document.getElementById('fontOpacity').value)*100) + '%';
    syncTextStyle();
  })
);

// Bold / Italic / Underline toggles
document.getElementById('btnBold').onclick   = () => { isBold   = !isBold;   document.getElementById('btnBold').style.background   = isBold   ? 'var(--accent)':'var(--border)'; syncTextStyle(); };
document.getElementById('btnItalic').onclick = () => { isItalic = !isItalic; document.getElementById('btnItalic').style.background = isItalic ? 'var(--accent)':'var(--border)'; syncTextStyle(); };
document.getElementById('btnUnder').onclick  = () => { isUnder  = !isUnder;  document.getElementById('btnUnder').style.background  = isUnder  ? 'var(--accent)':'var(--border)'; syncTextStyle(); };

// ─── ADD IMAGE ───────────────────────────────────────────────────────────────
document.getElementById('btnAddImg').onclick = () => document.getElementById('imgInput').click();

function onImgChosen(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => addImageAnn(getVisiblePage(), ev.target.result);
  reader.readAsDataURL(f);
  e.target.value = '';
}

function addImageAnn(pageNum, src) {
  const ov = document.getElementById('ov-' + pageNum);
  if (!ov) return;

  const tmp = new Image();
  tmp.onload = () => {
    const aspect = tmp.naturalWidth / tmp.naturalHeight;
    const w = Math.min(250, 794 * 0.35);
    const h = w / aspect;

    const el = document.createElement('div');
    el.className = 'ann img-ann';
    el.style.left    = '60px';
    el.style.top     = '60px';
    el.style.width   = w + 'px';
    el.style.height  = h + 'px';
    el.style.position = 'absolute';
    el.style.pointerEvents = 'auto';
    el._aspect = aspect;

    const img = document.createElement('img');
    img.src = src;
    img.style.opacity = '1';
    img.draggable = false;
    el.appendChild(img);

    addDelBtn(el, pageNum);
    addResizeHandle(el);
    makeDraggable(el, ov);
    ov.appendChild(el);
    saveAnn(pageNum, el, 'image');
    selectEl(el);
    toast('Image added');
  };
  tmp.src = src;
}

function updateSelImg() {
  if (!selEl || !selEl.classList.contains('img-ann')) return;
  const v   = document.getElementById('imgOpacity').value;
  document.getElementById('imgOpacityVal').textContent = Math.round(v*100)+'%';
  const img = selEl.querySelector('img');
  if (img) img.style.opacity = v;
}

function updateSelImgSize() {
  if (!selEl || !selEl.classList.contains('img-ann')) return;
  const w = parseInt(document.getElementById('imgW').value);
  const h = parseInt(document.getElementById('imgH').value);
  if (w > 0) selEl.style.width  = w + 'px';
  if (h > 0) selEl.style.height = h + 'px';
}

// ─── WATERMARK ───────────────────────────────────────────────────────────────
function wmSlider() {
  const op  = parseFloat(document.getElementById('wmOpacity').value);
  const rot = parseInt(document.getElementById('wmRotate').value);
  document.getElementById('wmOpacityVal').textContent = Math.round(op*100)+'%';
  document.getElementById('wmRotateVal').textContent  = rot+'°';
}

function applyWatermark() {
  const text   = document.getElementById('wmText').value || 'WATERMARK';
  const font   = document.getElementById('wmFont').value;
  const color  = document.getElementById('wmColor').value;
  const size   = parseInt(document.getElementById('wmSize').value) || 72;
  const op     = parseFloat(document.getElementById('wmOpacity').value);
  const rot    = parseInt(document.getElementById('wmRotate').value);
  const target = document.getElementById('wmTarget').value;

  const pages = target === 'all'
    ? Array.from({length:totalPages}, (_,i)=>i+1)
    : [getVisiblePage()];

  pages.forEach(p => {
    // Remove existing
    if (wms[p]) { wms[p].remove(); delete wms[p]; }
    const ov = document.getElementById('ov-'+p);
    if (!ov) return;

    const layer = document.createElement('div');
    layer.className = 'wm-layer';
    const span = document.createElement('span');
    span.className   = 'wm-text';
    span.textContent = text;
    span.style.fontFamily = font;
    span.style.fontSize   = size + 'px';
    span.style.color      = color;
    span.style.opacity    = op;
    span.style.transform  = `rotate(${rot}deg)`;
    layer.appendChild(span);
    ov.appendChild(layer);
    wms[p] = layer;
  });
  toast('Watermark applied');
}

function removeWatermark() {
  const target = document.getElementById('wmTarget').value;
  const pages = target === 'all'
    ? Object.keys(wms).map(Number)
    : [getVisiblePage()];
  pages.forEach(p => { if (wms[p]) { wms[p].remove(); delete wms[p]; } });
  toast('Watermark removed');
}

// ─── SELECTION ───────────────────────────────────────────────────────────────
function selectEl(el) {
  if (selEl) selEl.classList.remove('sel');
  selEl = el;
  if (!el) { deselect(); return; }
  el.classList.add('sel');
  document.getElementById('selSection').style.display = 'block';

  // Show image panel if image
  if (el.classList.contains('img-ann')) {
    document.getElementById('imgSection').style.display = 'block';
    const img = el.querySelector('img');
    document.getElementById('imgOpacity').value = img ? parseFloat(img.style.opacity||1) : 1;
    document.getElementById('imgOpacityVal').textContent = Math.round((parseFloat(document.getElementById('imgOpacity').value))*100)+'%';
    document.getElementById('imgW').value = parseInt(el.style.width);
    document.getElementById('imgH').value = parseInt(el.style.height);
  } else {
    document.getElementById('imgSection').style.display = 'none';
  }
}

function deselect() {
  if (selEl) selEl.classList.remove('sel');
  selEl = null;
  document.getElementById('selSection').style.display = 'none';
  document.getElementById('imgSection').style.display = 'none';
}

function deleteSelected() {
  if (!selEl) return;
  // remove from anns registry
  Object.keys(anns).forEach(p => {
    if (anns[p]) anns[p] = anns[p].filter(a => a.el !== selEl);
  });
  selEl.remove();
  deselect();
  toast('Deleted');
}

// Keyboard: Delete key
document.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.isContentEditable) return;
  if ((e.key==='Delete'||e.key==='Backspace') && selEl) { e.preventDefault(); deleteSelected(); }
  if (e.key==='Escape') deselect();
});

// ─── DRAG ────────────────────────────────────────────────────────────────────
function makeDraggable(el, container) {
  let ox, oy, dragging = false;
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('delbtn')) return;
    if (e.target.classList.contains('rhandle')) return;
    selectEl(el);
    // Don't drag if user wants to edit text
    if (el.classList.contains('text-ann') && e.detail >= 2) return;
    dragging = true;
    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;
    el.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    let nx = e.clientX - ox, ny = e.clientY - oy;
    const cw = container.offsetWidth  || 794;
    const ch = container.offsetHeight || 1123;
    nx = Math.max(0, Math.min(nx, cw - el.offsetWidth));
    ny = Math.max(0, Math.min(ny, ch - el.offsetHeight));
    el.style.left = nx + 'px';
    el.style.top  = ny + 'px';
    if (el.classList.contains('img-ann')) {
      document.getElementById('imgW').value = parseInt(el.style.width);
      document.getElementById('imgH').value = parseInt(el.style.height);
    }
  });
  el.addEventListener('pointerup', () => { dragging = false; });
}

// ─── RESIZE HANDLE ───────────────────────────────────────────────────────────
function addResizeHandle(el) {
  const h = document.createElement('div');
  h.className = 'rhandle';
  el.appendChild(h);
  let sx, sy, sw, sh, resizing=false;
  h.addEventListener('pointerdown', e => {
    resizing=true; sx=e.clientX; sy=e.clientY;
    sw=el.offsetWidth; sh=el.offsetHeight;
    h.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  h.addEventListener('pointermove', e => {
    if (!resizing) return;
    let nw = Math.max(20, sw+(e.clientX-sx));
    const aspect = el._aspect || null;
    let nh = aspect ? nw/aspect : Math.max(20, sh+(e.clientY-sy));
    el.style.width  = nw+'px';
    el.style.height = nh+'px';
    document.getElementById('imgW').value = Math.round(nw);
    document.getElementById('imgH').value = Math.round(nh);
  });
  h.addEventListener('pointerup', () => { resizing=false; });
}

// ─── DELETE BUTTON ───────────────────────────────────────────────────────────
function addDelBtn(el, pageNum) {
  const b = document.createElement('button');
  b.className = 'delbtn';
  b.textContent = '×';
  b.title = 'Delete';
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (anns[pageNum]) anns[pageNum] = anns[pageNum].filter(a => a.el !== el);
    el.remove();
    if (selEl===el) deselect();
  });
  el.appendChild(b);
}

// ─── ANN REGISTRY ────────────────────────────────────────────────────────────
function saveAnn(pageNum, el, type) {
  if (!anns[pageNum]) anns[pageNum] = [];
  anns[pageNum].push({el, type});
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function getVisiblePage() {
  // Find which page stack is most visible in the scroll container
  const main = document.getElementById('main');
  const mRect = main.getBoundingClientRect();
  let best=1, bestVis=0;
  for (let p=1; p<=totalPages; p++) {
    const el = document.getElementById('stack-'+p);
    if (!el) continue;
    const r  = el.getBoundingClientRect();
    const vis = Math.max(0, Math.min(r.bottom, mRect.bottom) - Math.max(r.top, mRect.top));
    if (vis > bestVis) { bestVis=vis; best=p; }
  }
  return best;
}

function hexToRgb(hex) {
  if (!hex || hex.length < 7) return {r:0,g:0,b:0};
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16)
  };
}

// ─── EXPORT / SAVE ───────────────────────────────────────────────────────────
document.getElementById('btnSave').onclick = exportPDF;

async function exportPDF() {
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Exporting...';
  toast('Building PDF...');

  try {
    const lib = await loadPDFLib();
    const { PDFDocument, rgb, StandardFonts, degrees } = lib;

    // Load original PDF or create blank
    let doc;
    if (pdfBytes) {
      doc = await PDFDocument.load(pdfBytes);
    } else {
      doc = await PDFDocument.create();
      doc.addPage([595, 842]);
    }

    const pages    = doc.getPages();
    const helvetica = await doc.embedFont(StandardFonts.Helvetica);

    for (let pNum = 1; pNum <= totalPages; pNum++) {
      const pdfPage = pages[pNum - 1];
      if (!pdfPage) continue;
      const { width, height } = pdfPage.getSize();

      // Overlay dimensions (fixed 794×1123 = A4 at 96dpi)
      const OW = 794, OH = 1123;
      const sx = width  / OW;
      const sy = height / OH;

      // Draw text annotations
      const pageAnns = anns[pNum] || [];
      for (const {el, type} of pageAnns) {
        const ax = parseFloat(el.style.left) || 0;
        const ay = parseFloat(el.style.top)  || 0;
        const aw = el.offsetWidth;
        const ah = el.offsetHeight;

        if (type === 'text') {
          const text = el.innerText || el.textContent || '';
          if (!text.trim()) continue;
          const fs   = parseFloat(el.style.fontSize) || 16;
          const c    = hexToRgb(el.style.color || '#000000');
          const op   = parseFloat(el.style.opacity ?? 1);
          const pdfX = ax * sx;
          const pdfY = height - (ay + ah) * sy;
          // Draw each line
          const lines = text.split('\n');
          const lineH = fs * sx * 1.3;
          lines.forEach((line, i) => {
            if (!line.trim()) return;
            pdfPage.drawText(line, {
              x: pdfX,
              y: pdfY + (lines.length - 1 - i) * lineH,
              size: Math.max(4, fs * sx),
              font: helvetica,
              color: rgb(c.r/255, c.g/255, c.b/255),
              opacity: op,
              maxWidth: (width - pdfX) * 0.95
            });
          });

        } else if (type === 'image') {
          const img    = el.querySelector('img');
          if (!img) continue;
          const op     = parseFloat(img.style.opacity ?? 1);
          const dataUrl = img.src;
          if (!dataUrl.startsWith('data:')) continue;
          try {
            const [header, b64] = dataUrl.split(',');
            const binary = atob(b64);
            const bytes2 = new Uint8Array(binary.length);
            for (let i=0; i<binary.length; i++) bytes2[i] = binary.charCodeAt(i);
            const emb = header.includes('png')
              ? await doc.embedPng(bytes2)
              : await doc.embedJpg(bytes2);
            pdfPage.drawImage(emb, {
              x: ax * sx,
              y: height - (ay + ah) * sy,
              width:  aw * sx,
              height: ah * sy,
              opacity: op
            });
          } catch(err) { console.warn('Image embed error:', err); }
        }
      }

      // Watermark
      if (wms[pNum]) {
        const span = wms[pNum].querySelector('.wm-text');
        if (span) {
          const text  = span.textContent;
          const c     = hexToRgb(span.style.color || '#888888');
          const op    = parseFloat(span.style.opacity ?? 0.2);
          const fs    = parseFloat(span.style.fontSize) || 72;
          const rotM  = (span.style.transform||'').match(/-?[\d.]+/);
          const rot   = rotM ? parseFloat(rotM[0]) : -35;
          pdfPage.drawText(text, {
            x: width  / 2 - (text.length * fs * sx * 0.28),
            y: height / 2,
            size:    Math.max(8, fs * Math.min(sx, sy)),
            font:    helvetica,
            color:   rgb(c.r/255, c.g/255, c.b/255),
            opacity: op,
            rotate:  degrees(rot)
          });
        }
      }
    }

    const out  = await doc.save();
    const blob = new Blob([out], {type:'application/pdf'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'annotated.pdf'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('PDF exported!');

  } catch(err) {
    toast('Export failed: ' + err.message, 4000);
    console.error(err);
  }

  btn.disabled = false;
  btn.textContent = 'Export PDF';
}
